{% extends "layout_public.html" %}
{% block title %}Login - GoTogether{% endblock %}
{% block content %}

<div class="auth-wrapper">
    <div class="back-to-home"><a href="/landing"><i class="fa-solid fa-arrow-left"></i> Back to Home</a></div>

    <div class="glass-panel auth-container">
        <div style="text-align: center; margin-bottom: var(--spacing-lg);">
            <i class="fa-solid fa-right-to-bracket" style="font-size: 32px; color: var(--primary); margin-bottom: var(--spacing-sm);"></i>
            <h2 style="margin-bottom: var(--spacing-xs);">Welcome Back</h2>
            <p style="color: var(--text-secondary); font-size: 14px;">Sign in to GoTogether</p>
        </div>

    <form onsubmit="event.preventDefault(); loginUser();">
        <div class="input-wrapper">
            <label class="input-label" for="email">Email Address</label>
            <input 
                type="email" 
                id="email" 
                placeholder="your.email@example.com"
                required
                autocomplete="email"
                aria-label="Email Address"
            >
        </div>
        
        <div class="input-wrapper">
            <label class="input-label" for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                placeholder="Enter your password"
                required
                autocomplete="current-password"
                aria-label="Password"
            >
        </div>

        <button type="submit">Login</button>

            <p style="margin-top: 20px; text-align: center;">
            Don't have an account? <a href="/register" style="color: var(--primary);">Register here</a>
        </p>
    </form>

    <!-- FORGOT PASSWORD SECTION -->
    <div id="forgotSection" style="display:none; margin-top:30px;">
        <h3>Verify Security Questions</h3>

        <div class="input-wrapper">
            <label class="input-label" for="fp_email">Email Address</label>
            <input 
                type="email" 
                id="fp_email" 
                placeholder="Enter your email"
                aria-label="Email Address"
            >
        </div>

        <div class="input-wrapper">
            <label class="input-label" for="fp_answer1">Answer to Question 1</label>
            <input 
                type="text" 
                id="fp_answer1" 
                placeholder="Your answer"
                aria-label="Security Answer 1"
            >
        </div>

        <div class="input-wrapper">
            <label class="input-label" for="fp_answer2">Answer to Question 2</label>
            <input 
                type="text" 
                id="fp_answer2" 
                placeholder="Your answer"
                aria-label="Security Answer 2"
            >
        </div>

        <button onclick="verifySecurity()">Verify Answers</button>

        <div id="resetOtpSection" style="display:none; margin-top:20px;">
            <div class="input-wrapper">
                <label class="input-label" for="fp_otp">OTP Code</label>
                <input 
                    type="text" 
                    id="fp_otp" 
                    placeholder="Enter 6-digit OTP"
                    maxlength="6"
                    aria-label="OTP Code"
                >
            </div>

            <div class="input-wrapper">
                <label class="input-label" for="fp_new_password">New Password</label>
                <input 
                    type="password" 
                    id="fp_new_password" 
                    placeholder="Enter new password"
                    minlength="6"
                    aria-label="New Password"
                >
            </div>

            <button onclick="resetPassword()">Reset Password</button>
        </div>
    </div>

    <p style="margin-top:20px; text-align: center;">
        <a href="#" onclick="event.preventDefault(); document.getElementById('forgotSection').style.display='block';">Forgot Password?</a>
    </p>
</section>

<script>
function showToast(msg, type = 'error') {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'toast toast-' + type;
    toast.textContent = msg;
    document.body.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('toast-show'));
    setTimeout(() => { toast.classList.remove('toast-show'); setTimeout(() => toast.remove(), 300); }, 3500);
}

async function loginUser() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    
    if (!email || !password) {
        showToast("Please fill in all fields");
        return;
    }

    const data = { email, password };

    try {
        const res = await fetch("/login_user", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        });

        const result = await res.json();

        if (result.redirect) {
            window.location.href = result.redirect;
        } else {
            showToast(result.error || "Login failed");
        }
    } catch (error) {
        showToast("An error occurred. Please try again.");
        console.error(error);
    }
}

// ================= FORGOT PASSWORD =================

async function verifySecurity() {
    const data = {
        email: document.getElementById("fp_email").value,
        answer1: document.getElementById("fp_answer1").value,
        answer2: document.getElementById("fp_answer2").value
    };

    if (!data.email || !data.answer1 || !data.answer2) {
        showToast("Please fill all security details");
        return;
    }

    try {
        const res = await fetch("/forgot_password/verify_security", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        });

        const result = await res.json();

        if (result.success) {
            showToast("Security answers verified. OTP sent to your email.", "success");
            document.getElementById("resetOtpSection").style.display = "block";
        } else {
            showToast(result.error || "Verification failed");
        }

    } catch (error) {
        showToast("An error occurred. Please try again.");
        console.error(error);
    }
}

async function resetPassword() {
    const data = {
        email: document.getElementById("fp_email").value,
        otp: document.getElementById("fp_otp").value,
        new_password: document.getElementById("fp_new_password").value
    };

    if (!data.otp || !data.new_password) {
        showToast("OTP and new password required");
        return;
    }

    try {
        const res = await fetch("/reset_password", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        });

        const result = await res.json();

        if (result.success) {
            showToast("Password reset successful", "success");
            window.location.href = "/login";
        } else {
            showToast(result.error || "Failed to reset");
        }
    } catch (error) {
        showToast("Something went wrong.");
        console.error(error);
    }
}
</script>

{% endblock %}
