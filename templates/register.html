{% extends "layout_public.html" %}
{% block title %}Register - GoTogether{% endblock %}
{% block content %}

<div class="auth-wrapper">
    <div class="back-to-home"><a href="/landing"><i class="fa-solid fa-arrow-left"></i> Back to Home</a></div>

    <div class="glass-panel auth-container">
        <div style="text-align: center; margin-bottom: var(--spacing-lg);">
            <i class="fa-solid fa-user-plus" style="font-size: 32px; color: var(--primary); margin-bottom: var(--spacing-sm);"></i>
            <h2 style="margin-bottom: var(--spacing-xs);">Register</h2>
            <p style="color: var(--text-secondary); font-size: 14px;">Create your GoTogether account</p>
        </div>

        <form onsubmit="event.preventDefault();">
            <div class="grid" style="gap: var(--spacing-md); margin-bottom: var(--spacing-md);">
                <div class="col-6 form-group">
                    <label class="form-label" for="first_name">First Name</label>
                    <input 
                        class="input"
                        id="first_name" 
                        type="text"
                        placeholder="First name"
                        required
                        autocomplete="given-name"
                    >
                </div>
                
                <div class="col-6 form-group">
                    <label class="form-label" for="last_name">Last Name</label>
                    <input 
                        class="input"
                        id="last_name" 
                        type="text"
                        placeholder="Last name"
                        required
                        autocomplete="family-name"
                    >
                </div>
            </div>
        
        <div class="form-group">
            <label class="form-label" for="dob">Date of Birth</label>
            <input 
                class="input"
                type="date" 
                id="dob"
                required
                aria-label="Date of Birth"
            >
        </div>
        
        <div class="form-group">
            <label class="form-label" for="contact">Contact Number</label>
            <input 
                class="input"
                id="contact" 
                type="tel"
                placeholder="Enter phone number"
                required
                autocomplete="tel"
                aria-label="Contact Number"
            >
        </div>
        
        <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input 
                class="input"
                type="email" 
                id="email" 
                placeholder="your.email@example.com"
                required
                autocomplete="email"
                aria-label="Email Address"
            >
        </div>
        
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input 
                class="input"
                type="password" 
                id="password" 
                placeholder="Create a password"
                required
                autocomplete="new-password"
                minlength="6"
                aria-label="Password"
            >
        </div>

        <!-- SECURITY QUESTION 1 -->
        <div class="form-group">
            <label class="form-label" for="security_q1">Security Question 1</label>
            <select class="input" id="security_q1" required aria-label="Security Question 1">
                <option value="">Select a question</option>
                <option value="pet">What is your first pet name?</option>
                <option value="school">What is your school name?</option>
                <option value="city">In which city were you born?</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label" for="security_a1">Answer 1</label>
            <input 
                class="input"
                id="security_a1" 
                type="text" 
                placeholder="Your answer"
                required
                aria-label="Security Answer 1"
            >
        </div>

        <!-- SECURITY QUESTION 2 -->
        <div class="form-group">
            <label class="form-label" for="security_q2">Security Question 2</label>
            <select class="input" id="security_q2" required aria-label="Security Question 2">
                <option value="">Select a question</option>
                <option value="mother">What is your mother's maiden name?</option>
                <option value="food">What is your favorite food?</option>
                <option value="movie">What is your favorite movie?</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label" for="security_a2">Answer 2</label>
            <input 
                class="input"
                id="security_a2" 
                type="text" 
                placeholder="Your answer"
                required
                aria-label="Security Answer 2"
            >
        </div>

        <button type="button" class="btn btn-secondary" style="width: 100%;" onclick="sendOTP()">Send OTP</button>

        <div class="form-group" style="margin-top: 20px;">
            <label class="form-label" for="otp">OTP Code</label>
            <input 
                class="input"
                id="otp" 
                type="text"
                placeholder="Enter 6-digit OTP"
                maxlength="6"
                aria-label="OTP Code"
            >
        </div>

        <button type="button" class="btn btn-primary" style="width: 100%;" onclick="verifyRegister()">Verify & Register</button>
        
        <p style="margin-top:20px; text-align: center;">
            Already have an account? <a href="/login" style="color: var(--primary);">Login here</a>
        </p>
    </form>
    </div>
</div>

<script>
function showToast(msg, type = 'error') {
    const existing = document.querySelector('.toast');
    if (existing) existing.remove();
    const toast = document.createElement('div');
    toast.className = 'toast toast-' + type;
    toast.textContent = msg;
    document.body.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add('toast-show'));
    setTimeout(() => { toast.classList.remove('toast-show'); setTimeout(() => toast.remove(), 300); }, 3500);
}

async function sendOTP() {
    const email = document.getElementById("email").value;
    
    if (!email) {
        showToast("Please enter your email address");
        return;
    }

    try {
        const res = await fetch("/register/send_otp", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({email})
        });

        const result = await res.json();
        
        if (result.success || res.ok) {
            showToast("OTP sent to your email", "success");
        } else {
            showToast(result.error || "Failed to send OTP");
        }
    } catch (error) {
        showToast("An error occurred. Please try again.");
        console.error(error);
    }
}

async function verifyRegister() {
    const data = {
        first_name: document.getElementById("first_name").value,
        last_name: document.getElementById("last_name").value,
        dob: document.getElementById("dob").value,
        contact: document.getElementById("contact").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
        security_q1: document.getElementById("security_q1").value,
        security_a1: document.getElementById("security_a1").value,
        security_q2: document.getElementById("security_q2").value,
        security_a2: document.getElementById("security_a2").value,
        otp: document.getElementById("otp").value
    };

    // Validation
    if (!data.first_name || !data.last_name || !data.dob || !data.contact || !data.email || !data.password || !data.security_q1 || !data.security_a1 || !data.security_q2 || !data.security_a2 || !data.otp) {
        showToast("Please fill in all fields");
        return;
    }

    try {
        const res = await fetch("/register/verify", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        });

        const result = await res.json();

        if (result.redirect) {
            window.location.href = result.redirect;
        } else {
            showToast(result.error || "Registration failed");
        }
    } catch (error) {
        showToast("An error occurred. Please try again.");
        console.error(error);
    }
}
</script>

{% endblock %}
